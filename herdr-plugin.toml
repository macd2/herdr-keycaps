id = "macd2.keycaps"
name = "Keycaps"
version = "1.2.0"
# 0.9.3 is the version this was built and verified against. The changelog
# does not record when popup panes or layout.set_split_ratio landed, so a
# lower floor would be a guess that fails on someone else's machine.
min_herdr_version = "0.9.3"
description = "The faster way to drive herdr: every binding one keypress away, plus the pane moves herdr leaves to the CLI"
platforms = ["linux", "macos"]

# herdr cannot print a message for a plugin at install time: the install preview
# emits only herdr's own fields, and a build command's output is piped and
# discarded unless it fails, which aborts the install. So the first moment this
# plugin can speak is a server start, and it only speaks when nothing is bound.
[[startup]]
command = ["python3", "remind.py"]

# One-time setup. A plugin manifest has no field for a keybinding and
# `herdr plugin install` never touches config.toml, so a fresh machine has every
# action below and no key that reaches one. This merges bindings.toml into the
# user's config, skipping anything they already bound.
[[actions]]
id = "setup"
title = "Set up keybindings"
contexts = ["pane", "workspace"]
command = ["python3", "setup.py"]

# The popup surface. placement = "popup" keeps it transient: it takes all
# terminal input, including Escape, and closes when the pager exits, without
# disturbing the tiled layout.
[[panes]]
id = "keys"
title = "Keycaps"
placement = "popup"
width = "70%"
height = "80%"
command = ["python3", "keycaps.py"]

# Keybindings can only target actions, not panes, so this action is the shim
# that opens the pane above. Bind it with type = "plugin_action".
[[actions]]
id = "show"
title = "Show keybindings"
contexts = ["pane", "workspace"]
command = ["python3", "show.py"]

# Moving a pane between tabs. Herdr can do it from the CLI but exposes no
# keybinding action, and move_tab_* move whole tabs, not panes.
[[panes]]
id = "picker"
title = "Move pane"
placement = "popup"
width = "50%"
height = "40%"
command = ["python3", "picker.py"]

[[actions]]
id = "move"
title = "Move pane to tab"
contexts = ["pane"]
command = ["python3", "move.py"]

# Swapping a pane with its neighbour: also CLI-only in herdr. One script backs
# all four; it reads the direction from HERDR_PLUGIN_ACTION_ID.
[[actions]]
id = "swap-left"
title = "Swap pane left"
contexts = ["pane"]
command = ["python3", "swap.py"]

[[actions]]
id = "swap-down"
title = "Swap pane down"
contexts = ["pane"]
command = ["python3", "swap.py"]

[[actions]]
id = "swap-up"
title = "Swap pane up"
contexts = ["pane"]
command = ["python3", "swap.py"]

[[actions]]
id = "swap-right"
title = "Swap pane right"
contexts = ["pane"]
command = ["python3", "swap.py"]

# Closing a tab. Herdr's confirm_close covers workspaces only, so the prompt
# is ours.
[[panes]]
id = "confirm-close-tab"
title = "Close tab"
placement = "popup"
width = "40%"
height = "30%"
command = ["python3", "confirm.py"]

[[actions]]
id = "close-tab"
title = "Close tab (with confirmation)"
contexts = ["pane"]
command = ["python3", "close_tab.py"]

# Evening out the panes. Herdr's pane resize only shifts a split by a relative
# amount; setting ratios outright is socket-API only.
[[actions]]
id = "even"
title = "Even out panes"
contexts = ["pane"]
command = ["python3", "even.py"]
